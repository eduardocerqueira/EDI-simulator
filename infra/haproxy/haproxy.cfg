# HAProxy — load balancer in front of the FTP cluster (service name "ftp").
#
# FTP needs two kinds of TCP connections that must reach the SAME node:
#   control  :21                 → balanced across healthy nodes (leastconn)
#   data     passive port range  → each node owns a range, routed to that node
#       ftp-node-1  21100-21109
#       ftp-node-2  21110-21119
#       ftp-node-3  21120-21129
# Clients use EPSV (or PASV pinned to the control host), so data connections
# come back to this load balancer, which forwards them to the right node.
#
# Nodes are resolved through Docker's DNS every second, so when the platform
# controller replaces a dead node (new container, same network alias) the
# load balancer picks the new address up automatically.

global
  log stdout format raw local0 info
  maxconn 4096

defaults
  mode tcp
  log global
  option tcplog
  option dontlognull
  timeout connect 3s
  timeout client 5m
  timeout server 5m
  timeout check 2s

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 2
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
  hold nx 1s
  hold refused 1s
  hold timeout 1s
  hold other 1s
  hold obsolete 1s

# ---------------------------------------------------------------- control
frontend ftp_control
  bind :21
  default_backend ftp_control

backend ftp_control
  balance leastconn
  # FTP-aware health check: the node must send its "220" greeting.
  option tcp-check
  tcp-check connect
  tcp-check expect rstring ^220
  default-server inter 1s fall 2 rise 2 resolvers docker init-addr libc,none on-marked-down shutdown-sessions
  server node1 ftp-node-1:21 check
  server node2 ftp-node-2:21 check
  server node3 ftp-node-3:21 check

# ---------------------------------------------------------------- passive data
# A server without a port forwards to the same port the client connected to.
frontend ftp_pasv_1
  bind :21100-21109
  default_backend pasv_1
backend pasv_1
  default-server resolvers docker init-addr libc,none
  server node1 ftp-node-1 check port 21 inter 1s fall 2 rise 2

frontend ftp_pasv_2
  bind :21110-21119
  default_backend pasv_2
backend pasv_2
  default-server resolvers docker init-addr libc,none
  server node2 ftp-node-2 check port 21 inter 1s fall 2 rise 2

frontend ftp_pasv_3
  bind :21120-21129
  default_backend pasv_3
backend pasv_3
  default-server resolvers docker init-addr libc,none
  server node3 ftp-node-3 check port 21 inter 1s fall 2 rise 2

# ---------------------------------------------------------------- stats + metrics
frontend stats
  mode http
  bind :8404
  http-request use-service prometheus-exporter if { path /metrics }
  stats enable
  stats uri /
  stats refresh 2s
  stats show-legends
