# vsftpd configuration for the EDI simulator (plain FTP, local users only).
listen=YES
listen_ipv6=NO
background=NO
seccomp_sandbox=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
# 002 → files are group-writable so the distributor (group "edi") can move them
local_umask=002
file_open_mode=0664

chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
# Clients use EPSV (or PASV pinned to the control-connection host), so no
# pasv_address is needed for either Docker-network or host clients.

utf8_filesystem=YES
use_localtime=NO
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=NO
vsftpd_log_file=/var/log/vsftpd.log
dirmessage_enable=NO
ftpd_banner=Harvest Hub EDI FTP gateway
max_clients=100
max_per_ip=50
idle_session_timeout=300
