# Prometheus for the EDI simulator platform.   http://localhost:9090
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # FTP load balancer: per-node status, sessions and traffic (control + passive data)
  - job_name: haproxy
    static_configs:
      - targets: ['ftp:8404']
  # Self-healing controller: node up/down, generations, recovery time, shared storage
  - job_name: platform-controller
    static_configs:
      - targets: ['platform-controller:9100']
  - job_name: distributor-api
    metrics_path: /metrics
    static_configs:
      - targets: ['distributor-api:4000']
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
