name: edi-simulator

x-api-build: &api-build
  context: .
  dockerfile: infra/docker/Dockerfile
  target: api

x-ftp-env: &ftp-env
  FTP_DISTRIBUTOR_PASSWORD: ${FTP_DISTRIBUTOR_PASSWORD:-distributor123}
  FTP_PRODUCER_PASSWORD: ${FTP_PRODUCER_PASSWORD:-producer123}

x-ftp-node: &ftp-node
  build:
    context: ./infra/ftp
    dockerfile: Containerfile
  image: edi-ftp-node:local
  volumes:
    - ftp-storage:/srv/ftp   # the shared storage every node mounts
  restart: "no"

services:
  # ------------------------------------------------------------------ infra
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edi
      POSTGRES_PASSWORD: edi
      POSTGRES_DB: edi
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edi"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: edi
      RABBITMQ_DEFAULT_PASS: edi
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI  http://localhost:15672  (edi / edi)
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  # ---------------------------------------------------------- FTP cluster (HA)
  # Load balancer: keeps the service name "ftp" so every client is unchanged.
  ftp:
    image: haproxy:2.9-alpine
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0   # HAProxy runs as non-root and binds :21
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${FTP_PORT:-21}:21"
      - "21100-21129:21100-21129"   # passive data ports, 10 per node
      - "8404:8404"                 # HAProxy stats page + /metrics
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8404/metrics"]
      interval: 5s
      retries: 20
    depends_on: [ftp-node-1, ftp-node-2, ftp-node-3]
    restart: unless-stopped

  # Three identical FTP nodes on ONE shared storage volume. The platform
  # controller replaces any node that stops answering (restart is "no" on
  # purpose so self-healing is done by the controller, not by Docker).
  ftp-node-1:
    <<: *ftp-node
    environment: { <<: *ftp-env, FTP_NODE_NAME: ftp-node-1, FTP_PASV_MIN_PORT: 21100, FTP_PASV_MAX_PORT: 21109 }
    labels: { edi.platform.role: ftp-node, edi.platform.slot: "1", edi.platform.generation: "1" }
  ftp-node-2:
    <<: *ftp-node
    environment: { <<: *ftp-env, FTP_NODE_NAME: ftp-node-2, FTP_PASV_MIN_PORT: 21110, FTP_PASV_MAX_PORT: 21119 }
    labels: { edi.platform.role: ftp-node, edi.platform.slot: "2", edi.platform.generation: "1" }
  ftp-node-3:
    <<: *ftp-node
    environment: { <<: *ftp-env, FTP_NODE_NAME: ftp-node-3, FTP_PASV_MIN_PORT: 21120, FTP_PASV_MAX_PORT: 21129 }
    labels: { edi.platform.role: ftp-node, edi.platform.slot: "3", edi.platform.generation: "1" }

  # Self-healing + platform metrics (needs the Docker socket to replace nodes).
  platform-controller:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: platform
    environment:
      AMQP_URL: amqp://edi:edi@rabbitmq:5672
      PROMETHEUS_URL: http://prometheus:9090
      STORAGE_PATH: /srv/ftp
      FTP_SLOTS: "1,2,3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ftp-storage:/srv/ftp:ro
    ports: ["9100:9100"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      retries: 30
      start_period: 10s
    depends_on:
      rabbitmq: { condition: service_healthy }
      ftp-node-1: { condition: service_started }
      ftp-node-2: { condition: service_started }
      ftp-node-3: { condition: service_started }
    restart: unless-stopped

  # Prometheus scrapes the load balancer, the controller and the apps, and
  # evaluates the FTP cluster alert rules.   http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------------------ web app 1
  distributor-api:
    build: { <<: *api-build, args: { APP: distributor-api } }
    environment:
      DATABASE_URL: postgresql://edi:edi@postgres:5432/distributor
      AMQP_URL: amqp://edi:edi@rabbitmq:5672
      FTP_HOST: ftp
      FTP_PORT: 21
      FTP_USER: distributor
      FTP_PASSWORD: ${FTP_DISTRIBUTOR_PASSWORD:-distributor123}
      FTP_POLL_INTERVAL_MS: ${FTP_POLL_INTERVAL_MS:-5000}
      ORDER_API_URL: http://order-api:4100
      PROMETHEUS_URL: http://prometheus:9090
      PLATFORM_CONTROLLER_URL: http://platform-controller:9100
      ORDER_API_KEY: ${INTEGRATION_API_KEY:-integration-key-change-me}
      DELIVERY_FAILURE_RATE: ${DELIVERY_FAILURE_RATE:-0.05}
      JWT_SECRET: ${DISTRIBUTOR_JWT_SECRET:-dev-distributor-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@harvesthub.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      ftp: { condition: service_started }
    restart: unless-stopped

  distributor-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
      args: { APP: distributor-web }
    ports: ["3000:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on: [distributor-api]

  # ------------------------------------------------------------ web app 2
  order-api:
    build: { <<: *api-build, args: { APP: order-api } }
    environment:
      DATABASE_URL: postgresql://edi:edi@postgres:5432/orders
      AMQP_URL: amqp://edi:edi@rabbitmq:5672
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-integration-key-change-me}
      JWT_SECRET: ${ORDER_JWT_SECRET:-dev-order-secret-change-me}
      PAYMENT_TERMS_DAYS: 30
    ports: ["4100:4100"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  order-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
      args: { APP: order-web }
    ports: ["3001:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on: [order-api]

  # ------------------------------------------------------------ tools (opt-in)
  # docker compose run --rm simulator producers --bootstrap -n 30
  # docker compose run --rm simulator customers -o 20
  simulator:
    profiles: [tools]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: simulator
    environment:
      FTP_HOST: ftp
      FTP_PORT: 21
      FTP_PRODUCER_PASSWORD: ${FTP_PRODUCER_PASSWORD:-producer123}
      ORDER_API_URL: http://order-api:4100
    volumes: [simdata:/data]
    # no depends_on: it runs against an already running stack (and must not try to
    # restart an FTP node that a chaos test froze on purpose)

volumes:
  pgdata:
  rabbitdata:
  ftp-storage:   # shared FTP storage (mailboxes) mounted by every FTP node
  simdata:
